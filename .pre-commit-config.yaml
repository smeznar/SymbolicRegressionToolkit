repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Run in the project's conda environment when it exists, whatever environment the commit comes
        # from (e.g. an editor's git panel started with conda's base); otherwise use pytest on PATH.
        entry: >-
          bash -c 'if conda env list 2>/dev/null | grep -q "^SymbolicRegressionToolkit ";
          then exec conda run -n SymbolicRegressionToolkit --no-capture-output pytest SRToolkit/ tests/;
          else exec pytest SRToolkit/ tests/; fi'
        language: system
        pass_filenames: false
        always_run: true
